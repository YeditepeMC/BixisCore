name: BixisCore
main: com.yeditepemc.bixiscore.BixisCorePlugin
version: 1.0.1-SNAPSHOT
api-version: '1.21'
authors: [iBerkS]
description: YeditepeMC ağı için merkezi veri ve API kütüphanesi.
softdepend: [Vault, PlaceholderAPI]

# Paper çalışma zamanında bu kütüphaneleri Maven Central'dan indirip önbelleğe alır.
# Böylece jar'a shade edilmezler (jar boyutu ~50 KB'a düşer).
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.46.1.3
  - com.mysql:mysql-connector-j:8.3.0

commands:
  level:
    description: Level ilerleme ve ödül GUI'sini açar
    usage: /level
    permission: bixiscore.level
  # NOT: info/addcoin/reset GEÇİCİ TEST amaçlıdır; "addxp <oyuncu> <miktar>" ise
  # KALICIDIR (SkyWarsReloaded konsoldan XP ödülü için çağırır).
  bixiscore:
    description: BixisCore komutu (addxp konsoldan, diğerleri test)
    usage: /bixiscore addxp <oyuncu> <miktar>
    permission: bixiscore.admin

permissions:
  bixiscore.level:
    description: /level komutunu kullanma izni
    default: true
  bixiscore.admin:
    description: BixisCore test komutlarını kullanma izni
    default: op
